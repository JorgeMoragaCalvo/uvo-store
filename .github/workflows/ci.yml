name: CI

# B3: main faltaba aquí, así que un push directo a main no ejecutaba ni un test — y el commit
# "nordika store test" entró exactamente así. Curiosamente Qodana sí corría en main
# (qodana_code_quality.yml), de modo que main recibía análisis estático pero no la suite.
on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

# PROD-22. The job only reads the repository; nothing here pushes, comments or publishes. Without this
# block the token takes whatever default the repository's Actions settings have.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: uvostore
          POSTGRES_USER: uvostore
          POSTGRES_PASSWORD: uvostore
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up the Maven distribution
        uses: ./.github/actions/maven-wrapper

      - name: Build and test
        env:
          DB_URL: jdbc:postgresql://localhost:5432/uvostore
          DB_USERNAME: uvostore
          DB_PASSWORD: uvostore
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

  frontend:
    name: Frontend (npm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # IMP-03. Las alertas versionadas en ops/monitoring/: que las reglas compilen, que cada alerta dispare con su
  # serie y no sin ella (alerts.test.yml), y que la configuración de Alertmanager y el dashboard sean válidos.
  # Las imágenes van fijadas: un cambio de versión de Prometheus no puede cambiar en silencio lo que se prueba.
  monitoring:
    name: Monitoring (promtool)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check and test alert rules
        run: |
          docker run --rm -v "$PWD/ops/monitoring:/m:ro" -w /m/prometheus --entrypoint promtool \
            prom/prometheus:v3.5.0 check rules alerts.yml
          docker run --rm -v "$PWD/ops/monitoring:/m:ro" -w /m/prometheus --entrypoint promtool \
            prom/prometheus:v3.5.0 test rules alerts.test.yml

      - name: Check Alertmanager config
        run: |
          docker run --rm -v "$PWD/ops/monitoring:/m:ro" --entrypoint amtool \
            prom/alertmanager:v0.28.1 check-config /m/alertmanager/alertmanager.example.yml

      - name: Check Grafana dashboard JSON
        run: python3 -m json.tool ops/monitoring/grafana/uvostore-operacion.json > /dev/null

  # IMP-04. La configuración de nginx de ops/nginx/: que las plantillas de cada ambiente sean válidas (con
  # certificados de prueba en lugar de los de Certbot) y que el script de publicación haga lo que promete. Las rutas,
  # cabeceras y caché las prueba el E2E, que sirve el build con esos mismos archivos.
  # IMP-05: staging y production renderizados juntos, con default.conf y un dominio propio en cada uno, como quedan
  # en el servidor compartido (dos upstream, dos raíces, ningún server_name repetido); y shellcheck de los scripts.
  nginx:
    name: nginx (config and publish script)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nginx
        run: |
          # El runner trae el repositorio de paquetes de Microsoft, que a veces responde 403 y tumba el
          # apt-get update entero. Este job no usa nada de ahí.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends nginx
          nginx -v

      - name: Check the configuration of both environments
        run: |
          set -o pipefail
          . ops/servidor/comun.sh
          work=$(mktemp -d)
          mkdir -p "$work/uvostore" "$work/certs" "$work/logs"
          cp ops/nginx/uvostore-locations.conf ops/nginx/security-headers.conf "$work/uvostore/"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=prueba \
            -keyout "$work/certs/privkey.pem" -out "$work/certs/fullchain.pem" 2> /dev/null
          puerto=8081
          for ambiente in staging production; do
            mkdir -p "$work/uvostore/$ambiente/dominios"
            renderizar ops/nginx/uvostore.conf.template "$work/uvostore-$ambiente.conf" AMBIENTE=$ambiente \
              DOMINIO_TIENDAS=tiendas-$ambiente.example.cl PUERTO_BACKEND=$puerto CERTS_TIENDAS="$work/certs"
            renderizar ops/nginx/dominio-propio.conf.template "$work/uvostore/$ambiente/dominios/propio.conf" \
              AMBIENTE=$ambiente DOMINIO=tienda-$ambiente.example CERTS_DOMINIO="$work/certs"
            puerto=$((puerto + 1))
          done
          cat > "$work/nginx.conf" << FIN
          pid logs/nginx.pid;
          events {}
          http {
            include /etc/nginx/mime.types;
            include $PWD/ops/nginx/default.conf;
            include uvostore-staging.conf;
            include uvostore-production.conf;
          }
          FIN
          sudo nginx -t -e logs/error.log -p "$work/" -c "$work/nginx.conf" 2>&1 | tee "$work/nginx-t.log"
          # Un server_name repetido es solo un aviso para nginx, pero aquí significaría que un ambiente pisa al otro.
          if grep -q 'conflicting server name' "$work/nginx-t.log"; then exit 1; fi

      - name: Test the publish script
        run: bash ops/nginx/publicar-frontend.test.sh

      - name: Shellcheck
        run: shellcheck -S warning -x ops/nginx/*.sh ops/servidor/*.sh ops/servidor/ensayo/*.sh ops/respaldo/*.sh

  # IMP-05 (paso 7). Construye staging desde cero en una máquina Ubuntu limpia, solo con los scripts de ops/ y los
  # artefactos armados como en release.yml, y comprueba lo que prometen: systemd con APP_ENVIRONMENT=staging (todas
  # las reglas de arranque, roles de base incluidos), nginx con hosts desconocidos rechazados, dos tiendas, una
  # imagen en S3 (S3Mock) que sobrevive a reinicio, redespliegue y vuelta atrás, un dominio propio con su cambio, y
  # (IMP-06, C11) un correo de restablecimiento que sale solo tras una caída del SMTP y un reinicio, invalidando el
  # anterior. Simulado: certificados autofirmados, S3Mock y Mailpit (detalle en ops/servidor/ensayo/ensayo.sh). El
  # informe de verificar.sh queda como artefacto.
  # IMP-09 (C10) le suma el respaldo con pgBackRest (contra S3Mock por https, o un repositorio posix si S3Mock no le
  # sirve: lo dice c10.txt), la copia de imágenes, una restauración aislada a un punto en el tiempo en modo
  # recuperación (sin reenviar lo que ya salió, con la llave recuperada y su sonda) y la medición de RPO/RTO. El acta
  # técnica y el informe de conciliación quedan en el artefacto.
  ensayo-servidor:
    name: Staging rehearsal (clean server)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up the Maven distribution
        uses: ./.github/actions/maven-wrapper

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the artifacts as release.yml does
        run: |
          tag="ensayo-${GITHUB_SHA::7}"
          dir="$RUNNER_TEMP/artefactos"
          mkdir -p "$dir"
          ./mvnw --batch-mode --no-transfer-progress -DskipTests package
          cp "$(find target -maxdepth 1 -name '*.jar' ! -name '*original*' | head -n1)" "$dir/uvo-store-$tag.jar"
          (cd frontend && npm ci && VITE_SENTRY_ENVIRONMENT=staging VITE_SENTRY_RELEASE="$tag" npm run build)
          (cd frontend && zip -qr "$dir/frontend-dist-$tag-staging.zip" dist)
          (cd "$dir" && sha256sum "uvo-store-$tag.jar" "frontend-dist-$tag-staging.zip" > SHA256SUMS && cat SHA256SUMS)
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Server packages, S3Mock and Mailpit
        run: |
          # El runner trae el repositorio de paquetes de Microsoft, que a veces responde 403 y tumba el
          # apt-get update entero. Este job no usa nada de ahí.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends nginx postgresql jq pgbackrest unzip
          sudo systemctl start postgresql nginx
          nginx -v
          psql --version
          pgbackrest version
          # S3Mock y no MinIO: la imagen minio/minio ya no se publica en Docker Hub. 9191 es su https (pgBackRest
          # exige TLS; el ensayo no verifica el certificado).
          docker run -d --name s3mock -p 127.0.0.1:9090:9090 -p 127.0.0.1:9191:9191 adobe/s3mock:5.2.3
          docker run -d --name mailpit -p 127.0.0.1:1025:1025 -p 127.0.0.1:8025:8025 axllent/mailpit:v1.27.0
          for _ in $(seq 1 60); do curl -fs -o /dev/null http://127.0.0.1:9090/ && break; sleep 1; done
          curl -fsS -o /dev/null http://127.0.0.1:9090/

      # sudo con el PATH del job: el java de setup-java (21), no el que trae la imagen por omisión.
      - name: Rehearse
        run: |
          dir="$RUNNER_TEMP/artefactos"
          sudo env "PATH=$PATH" bash ops/servidor/ensayo/ensayo.sh "$dir/uvo-store-$TAG.jar" \
            "$dir/frontend-dist-$TAG-staging.zip" "$dir/SHA256SUMS" "$RUNNER_TEMP/informe"

      - name: Collect logs
        if: always()
        run: |
          # La carpeta la creó el ensayo como root.
          informe="$RUNNER_TEMP/informe"
          sudo mkdir -p "$informe"
          sudo chown -R "$(id -u)" "$informe"
          sudo journalctl -u uvostore-staging --no-pager 2>&1 | tee "$informe/backend.log" > /dev/null || true
          sudo cp /var/log/nginx/error.log "$informe/nginx-error.log" 2> /dev/null || true
          sudo cp /etc/nginx/conf.d/uvostore-staging.conf "$informe/" 2> /dev/null || true
          # IMP-09: la instancia restaurada, su clúster y pgBackRest.
          sudo journalctl -u uvostore-staging-restauracion --no-pager 2>&1 | tee "$informe/restaurada.log" > /dev/null || true
          sudo cp /var/lib/uvostore-restauracion/staging/run/postgresql.log "$informe/postgresql-restaurado.log" 2> /dev/null || true
          sudo sh -c 'cp /var/log/pgbackrest/*.log "$1"/' _ "$informe" 2> /dev/null || true
          sudo chown -R "$(id -u)" "$informe"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ensayo-servidor
          path: ${{ runner.temp }}/informe
          retention-days: 30

  # IMP-09 (C19, §11.1). Migración de la etiqueta anterior a este commit y vuelta atrás: el jar anterior con datos, la
  # candidata migrando encima, el anterior otra vez sobre el esquema migrado (¿arranca?) y la restauración del respaldo
  # de antes de migrar. Clasifica el paso (ROLLBACK_BINARIO o RESTAURAR_Y_CONCILIAR) en el resumen del job y en
  # migracion-rollback.json; se compara con la tabla de docs/recuperacion.md#migraciones. Falla si la candidata no migra
  # o si la restauración no devuelve los datos; la clasificación en sí no lo hace fallar, porque las dos son legítimas.
  migracion-rollback:
    name: Migration and rollback rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up the Maven distribution
        uses: ./.github/actions/maven-wrapper

      - name: Build the candidate and the previous tag
        run: |
          dir="$RUNNER_TEMP/jars"
          mkdir -p "$dir"
          anterior="$(git describe --tags --abbrev=0 HEAD^)"
          echo "Etiqueta anterior: $anterior"
          echo "ANTERIOR=$anterior" >> "$GITHUB_ENV"
          ./mvnw --batch-mode --no-transfer-progress -DskipTests package
          cp "$(find target -maxdepth 1 -name '*.jar' ! -name '*original*' | head -n1)" "$dir/candidato.jar"
          # La etiqueta anterior se arma desde su propio árbol, exportado aparte (no un worktree del checkout).
          # Si su wrapper pide otra versión de Maven, también se baja con reintentos y espejo.
          mkdir -p "$RUNNER_TEMP/anterior"
          git archive "$anterior" | tar -x -C "$RUNNER_TEMP/anterior"
          bash .github/scripts/traer-maven.sh "$RUNNER_TEMP/anterior"
          (cd "$RUNNER_TEMP/anterior" && ./mvnw --batch-mode --no-transfer-progress -DskipTests package)
          cp "$(find "$RUNNER_TEMP/anterior/target" -maxdepth 1 -name '*.jar' ! -name '*original*' | head -n1)" \
            "$dir/anterior-$anterior.jar"
          ls -l "$dir"

      - name: PostgreSQL
        run: |
          # El runner trae el repositorio de paquetes de Microsoft, que a veces responde 403 y tumba el
          # apt-get update entero. Este job no usa nada de ahí.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends postgresql jq unzip
          sudo systemctl start postgresql
          psql --version

      - name: Rehearse
        run: |
          dir="$RUNNER_TEMP/jars"
          sudo env "PATH=$PATH" "GITHUB_STEP_SUMMARY=$GITHUB_STEP_SUMMARY" bash ops/servidor/ensayo/migracion-rollback.sh \
            "$dir/anterior-$ANTERIOR.jar" "$dir/candidato.jar" "$RUNNER_TEMP/migracion"

      - name: Upload report
        if: always()
        run: sudo chown -R "$(id -u)" "$RUNNER_TEMP/migracion" 2> /dev/null || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migracion-rollback
          path: ${{ runner.temp }}/migracion
          retention-days: 30

  # PROD-14a. Red de navegador: Playwright contra el backend real. GAP-09: el job vive en e2e.yml porque
  # release.yml también lo llama. Su check se llama «E2E / E2E (Playwright)».
  e2e:
    name: E2E
    uses: ./.github/workflows/e2e.yml
