name: CI

# B3: main faltaba aquí, así que un push directo a main no ejecutaba ni un test — y el commit
# "nordika store test" entró exactamente así. Curiosamente Qodana sí corría en main
# (qodana_code_quality.yml), de modo que main recibía análisis estático pero no la suite.
on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: uvostore
          POSTGRES_USER: uvostore
          POSTGRES_PASSWORD: uvostore
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        env:
          DB_URL: jdbc:postgresql://localhost:5432/uvostore
          DB_USERNAME: uvostore
          DB_PASSWORD: uvostore
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

  frontend:
    name: Frontend (npm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
