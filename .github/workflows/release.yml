name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# PROD-22. Read-only by default; only the job that creates the GitHub Release asks for write access
# (below). The build jobs compile and test code from the tag and upload artifacts, none of which needs a
# token that can write to the repository.
permissions:
  contents: read

jobs:
  build-backend:
    name: Build backend (Maven)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: uvostore
          POSTGRES_USER: uvostore
          POSTGRES_PASSWORD: uvostore
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        env:
          DB_URL: jdbc:postgresql://localhost:5432/uvostore
          DB_USERNAME: uvostore
          DB_PASSWORD: uvostore
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Rename jar with release version
        run: |
          jar_file=$(ls target/*.jar | grep -v original | head -n1)
          cp "$jar_file" "uvo-store-${{ github.ref_name }}.jar"

      - name: Upload backend artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: uvo-store-${{ github.ref_name }}.jar
          retention-days: 7

  test-frontend:
    name: Test frontend (npm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  # IMP-03. One frontend build PER ENVIRONMENT. Vite bakes VITE_SENTRY_* into the bundle and csp.ts bakes the
  # Sentry origin into the index.html CSP, so a build cannot be promoted from staging to production by changing
  # variables at deploy time: each environment deploys its own zip. The DSN comes from the GitHub Environment of
  # the same name (Settings > Environments > staging|production > Variables > VITE_SENTRY_DSN). A browser DSN is
  # public by design (it ships in the bundle), so it is a variable, not a secret. Without it the release fails:
  # a tag does not publish a frontend whose errors go nowhere.
  build-frontend:
    name: Build frontend (${{ matrix.environment }})
    needs: test-frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        environment: [staging, production]
    environment: ${{ matrix.environment }}
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      VITE_SENTRY_ENVIRONMENT: ${{ matrix.environment }}
      # The same value the backend must get as SENTRY_RELEASE, so both layers report the same version.
      VITE_SENTRY_RELEASE: ${{ github.ref_name }}
    steps:
      - name: Require the Sentry DSN of this environment
        run: |
          if [ -z "${VITE_SENTRY_DSN// /}" ]; then
            echo "::error::The GitHub Environment '${{ matrix.environment }}' has no VITE_SENTRY_DSN variable. Create it before tagging (docs/observabilidad.md)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The CSP must let the bundle reach the DSN's origin, or the browser blocks every event silently. The
      # <meta> content is HTML-escaped (&#39; for the quotes), so it is read with node rather than grep.
      # IMP-04: and it must name no other origin than that one and Transbank's. The E2E builds its own copy with
      # a test DSN (frontend/e2e/launch/frontend.ts); nothing test-only may ever reach a published zip.
      - name: Check the CSP of the build
        run: |
          node -e '
            const html = require("fs").readFileSync("dist/index.html", "utf8");
            const origin = new URL(process.env.VITE_SENTRY_DSN.trim()).origin;
            const meta = /http-equiv="Content-Security-Policy" content="([^"]*)"/.exec(html);
            const policy = meta ? meta[1].replace(/&#39;/g, "'") : "";
            const connect = policy.split(";").map((d) => d.trim()).find((d) => d.startsWith("connect-src ")) ?? "";
            if (!connect.split(/\s+/).includes(origin)) {
              console.log(`::error::dist/index.html has no CSP connect-src for ${origin} (found: "${connect}").`);
              process.exit(1);
            }
            const allowed = new Set([origin, "https://webpay3g.transbank.cl", "https://webpay3gint.transbank.cl"]);
            const origins = policy.split(/[\s;]+/).filter((token) => token.includes("://"));
            const extra = origins.filter((o) => !allowed.has(o) || /localhost|127\.0\.0\.1/.test(o));
            if (extra.length > 0) {
              console.log(`::error::dist/index.html CSP names unexpected origins: ${extra.join(" ")}`);
              process.exit(1);
            }
            console.log(`CSP ${policy}`);
          '

      - name: Zip build output
        run: zip -r ../frontend-dist-${{ github.ref_name }}-${{ matrix.environment }}.zip dist

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist-${{ matrix.environment }}
          path: frontend-dist-${{ github.ref_name }}-${{ matrix.environment }}.zip
          retention-days: 7

  # GAP-09. The release used to publish without the browser suite, which only ran in ci.yml: a tag on a
  # commit with a broken E2E, or one CI never saw, went out anyway. It runs here on the tagged commit, in
  # parallel with the builds, and the release below waits for it.
  e2e:
    name: E2E
    uses: ./.github/workflows/e2e.yml

  release:
    name: Create GitHub Release
    needs: [build-backend, build-frontend, e2e]
    runs-on: ubuntu-latest
    # Creating the release and attaching the files is the one thing here that writes to the repository.
    permissions:
      contents: write
    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v8
        with:
          name: backend-jar

      - name: Download frontend artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: frontend-dist-*
          merge-multiple: true

      # IMP-05. The server scripts and configuration (ops/) of the same commit as the jar: the server provisions
      # and deploys with the scripts of the version it installs (docs/despliegue-backend.md), never a newer
      # checkout. Only ops/ is checked out; owner and dates are fixed so the same commit gives the same tarball.
      - name: Checkout ops/
        uses: actions/checkout@v7
        with:
          path: repo
          sparse-checkout: ops

      - name: Package ops/
        run: |
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime='@0' -C repo -czf             uvostore-ops-${{ github.ref_name }}.tar.gz ops
          rm -rf repo

      # IMP-03. What was deployed can be checked against what was built: sha256sum -c SHA256SUMS.
      - name: Checksums
        run: |
          sha256sum uvo-store-${{ github.ref_name }}.jar frontend-dist-${{ github.ref_name }}-*.zip             uvostore-ops-${{ github.ref_name }}.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            uvo-store-${{ github.ref_name }}.jar
            frontend-dist-${{ github.ref_name }}-staging.zip
            frontend-dist-${{ github.ref_name }}-production.zip
            uvostore-ops-${{ github.ref_name }}.tar.gz
            SHA256SUMS
