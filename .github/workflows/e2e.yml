name: E2E

# GAP-09. El E2E es un workflow reutilizable porque lo llaman dos: ci.yml, en cada push y pull request, y
# release.yml, que no publica la release sin él. Así la release prueba el commit exacto de la etiqueta en vez de
# fiarse de que el CI haya pasado por ahí. El checkout toma el commit del evento que lo llama.
on:
  workflow_call:

# Un workflow llamado no puede ampliar los permisos de quien lo llama, y este solo lee el repositorio.
permissions:
  contents: read

jobs:
  # PROD-14a. Red de navegador: Playwright contra el backend real (el jar) y los dobles del POS, del correo y de
  # las pasarelas. El lanzador (frontend/e2e/launch/backend.ts) crea su propia base, uvostore_e2e, en este
  # PostgreSQL.
  # IMP-04. El storefront es el BUILD de producción servido por nginx con la configuración de ops/nginx/
  # (modalidad dist, e2e/launch/frontend.ts), no Vite: así se prueban la CSP real, las cabeceras, la caché y las
  # rutas del proxy. Con éxito queda el artefacto e2e-evidencia: el build probado, su SHA-256 y el nginx.conf.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: uvostore
          POSTGRES_USER: uvostore
          POSTGRES_PASSWORD: uvostore
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up the Maven distribution
        uses: ./.github/actions/maven-wrapper

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Los tests del backend ya los corre su job; aquí solo hace falta el jar.
      - name: Package backend
        run: ./mvnw --batch-mode --no-transfer-progress package -DskipTests

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # El de la distribución: el E2E lo arranca sin root, con su propio prefijo y configuración.
      - name: Install nginx
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends nginx
          nginx -v

      - name: Run E2E
        working-directory: frontend
        env:
          E2E_DB_USERNAME: uvostore
          E2E_DB_PASSWORD: uvostore
        run: npm run e2e

      # IMP-04. Lo que se probó, para poder comprobarlo después: el build tal como lo sirvió nginx (mismo commit y
      # mismo comando que los zips del release; cambian solo los VITE_SENTRY_*), su suma y la configuración.
      - name: Package the tested build
        working-directory: frontend
        run: |
          mkdir -p ../e2e-evidencia
          (cd e2e && cp -r .dist dist && zip -qr ../../e2e-evidencia/frontend-dist-e2e.zip dist && rm -rf dist)
          cp -r e2e/.logs/nginx/nginx.conf e2e/.logs/nginx/uvostore ../e2e-evidencia/
          cd ../e2e-evidencia
          sha256sum frontend-dist-e2e.zip > SHA256SUMS
          {
            echo "commit: ${GITHUB_SHA}"
            echo "ref: ${GITHUB_REF}"
            echo "node: $(node --version)"
            echo "nginx: $(nginx -v 2>&1)"
            echo "VITE_SENTRY_RELEASE: e2e-${GITHUB_SHA::7}"
          } > build-info.txt
          cat SHA256SUMS build-info.txt

      - name: Upload E2E evidence
        uses: actions/upload-artifact@v7
        with:
          name: e2e-evidencia
          path: |
            e2e-evidencia/
            frontend/playwright-report/
          retention-days: 90

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/e2e/.logs/
          retention-days: 7
