name: E2E

# GAP-09. El E2E es un workflow reutilizable porque lo llaman dos: ci.yml, en cada push y pull request, y
# release.yml, que no publica la release sin él. Así la release prueba el commit exacto de la etiqueta en vez de
# fiarse de que el CI haya pasado por ahí. El checkout toma el commit del evento que lo llama.
on:
  workflow_call:

# Un workflow llamado no puede ampliar los permisos de quien lo llama, y este solo lee el repositorio.
permissions:
  contents: read

jobs:
  # PROD-14a. Red de navegador: Playwright contra el backend real (el jar), Vite y los dobles del POS y del
  # correo. El lanzador (frontend/e2e/launch/backend.ts) crea su propia base, uvostore_e2e, en este PostgreSQL.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: uvostore
          POSTGRES_USER: uvostore
          POSTGRES_PASSWORD: uvostore
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Los tests del backend ya los corre su job; aquí solo hace falta el jar.
      - name: Package backend
        run: ./mvnw --batch-mode --no-transfer-progress package -DskipTests

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        working-directory: frontend
        env:
          E2E_DB_USERNAME: uvostore
          E2E_DB_PASSWORD: uvostore
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/e2e/.logs/
          retention-days: 7
