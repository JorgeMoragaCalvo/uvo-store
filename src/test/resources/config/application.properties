# IMP-02. APP_ENVIRONMENT ya no tiene valor por defecto en src/main/resources/application.properties: la suite
# declara el suyo aqui. Spring carga classpath:/config/application.properties ENCIMA del principal, asi que esto solo
# fija el ambiente y el resto de valores siguen siendo los de main. Las pruebas de las reglas de produccion no
# pasan por aqui: construyen sus propiedades a mano (ProductionConfigurationRulesTest).
app.environment=development
