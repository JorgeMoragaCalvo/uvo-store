# IMP-02. APP_ENVIRONMENT ya no tiene valor por defecto en src/main/resources/application.properties: la suite
# declara el suyo aqui. Spring carga classpath:/config/application.properties ENCIMA del principal, asi que esto solo
# fija el ambiente y el resto de valores siguen siendo los de main. Las pruebas de las reglas de produccion no
# pasan por aqui: construyen sus propiedades a mano (ProductionConfigurationRulesTest).
app.environment=development

# IMP-09. La suite cifra con su propia llave (pom.xml), pero corre sobre la base local, que tiene credenciales que el
# desarrollo cifro con la llave del .env. La sonda de descifrado las ve, con razon, y dejaria /actuator/health y la
# readiness en DOWN en cualquier prueba de salud. Aqui el indicador se apaga y la readiness queda como antes; que la
# sonda este en la readiness de verdad y que el indicador decida bien lo fija CredentialsReadinessTest, y la sonda
# misma, CredentialDecryptProbeTest.
app.health.credentials.enabled=false
management.endpoint.health.group.readiness.include=readinessState,db
