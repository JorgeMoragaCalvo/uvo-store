spring.application.name=uvo-store

# charSet=UTF8 forces pgjdbc to encode/decode strings as UTF-8 regardless of the JVM's platform
# default charset — without it, on a Windows JVM (sun.jnu.encoding defaults to a Windows-125x code
# page, not UTF-8), any accented Spanish text sent to Postgres gets corrupted into U+FFFD
# replacement characters before it's even written (Postgres then rejects it: "character ... has no
# equivalent in encoding WIN1252"). Harmless/no-op on platforms whose default charset is already
# UTF-8 (Linux CI, most non-Windows dev machines).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/uvostore?charSet=UTF8}
spring.datasource.username=${DB_USERNAME:uvostore}
spring.datasource.password=${DB_PASSWORD:}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# REQUIRED, no default (C4). This used to ship a working dev fallback, which meant a deployment
# that forgot JWT_SECRET booted anyway with a secret published in this repo — anyone could forge an
# admin token for any store. JwtService now refuses to start when it's missing, too short (<32
# bytes) or still the old committed value. Set it in .env locally (see .env.example); tests get
# their own value from the surefire config in pom.xml.
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
app.upload-dir=${APP_UPLOAD_DIR:uploads}

# Fase 4: file storage driver — "local" (default, dev/CI-friendly, no cloud credentials needed) or
# "s3" (real AWS S3 or any S3-compatible provider via app.storage.s3.endpoint — MinIO, DigitalOcean
# Spaces, Cloudflare R2). One shared bucket for the whole platform; see S3FileStorageServiceImpl for
# why no per-object ACL is set (bucket must have its own public-read policy configured).
app.storage.driver=${APP_STORAGE_DRIVER:local}
app.storage.s3.bucket=${APP_STORAGE_S3_BUCKET:}
app.storage.s3.region=${APP_STORAGE_S3_REGION:us-east-1}
app.storage.s3.access-key=${APP_STORAGE_S3_ACCESS_KEY:}
app.storage.s3.secret-key=${APP_STORAGE_S3_SECRET_KEY:}
# Only needed for S3-compatible providers other than real AWS (MinIO/Spaces/R2).
app.storage.s3.endpoint=${APP_STORAGE_S3_ENDPOINT:}
# Optional CDN override — if set, publicUrl() returns {public-base-url}/{key} instead of the
# bucket's own default virtual-hosted-style URL.
app.storage.s3.public-base-url=${APP_STORAGE_S3_PUBLIC_BASE_URL:}

# Falls back to the Setting rows (stripe_secret_key/stripe_webhook_secret) when present,
# same precedence as the Laravel StripeService — these are the env-var fallback only.
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.default-currency=${STRIPE_CURRENCY:clp}

# Base URL of the SPA storefront, used to build default Stripe success/cancel URLs when the
# caller doesn't supply its own.
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# AES-256 key (base64, 32 raw bytes) for PaymentGatewayConfig.credentials and the settings secrets
# at rest. REQUIRED, no default (C4) — the old fallback was committed here, so it protected nothing.
# EncryptionKeyHolder refuses to start without it. Unlike the other two secrets it only *warns* when
# it sees the old committed value, because rotating this key makes existing encrypted rows
# unreadable; production must start from a fresh key (openssl rand -base64 32).
app.encryption-key=${APP_ENCRYPTION_KEY:}

# Webpay Plus Mall (Transbank): the parent commerce code + API key are issued ONCE to the
# platform operator (us), not per store — each store only configures its own CHILD commerce
# code via PaymentGatewayConfig. Defaults are Transbank's own published integration/sandbox
# values (safe to commit, not secret — see cl.transbank.common.IntegrationCommerceCodes/
# IntegrationApiKeys in the SDK) so Webpay works out of the box in dev/CI with zero setup.
webpay.parent-commerce-code=${WEBPAY_PARENT_COMMERCE_CODE:597055555535}
webpay.api-key=${WEBPAY_API_KEY:579B532A7440BB0C9079DED94D31EA1615BACEB56610332264630D42D0A36B1C}
webpay.environment=${WEBPAY_ENVIRONMENT:integration}

# Fase 3: Chilexpress quote-only cotizador — contract unverified against live docs/sandbox, see
# ChilexpressQuoteClient's class comment before enabling in production. Per-store subscriptionKey
# lives encrypted in the ShippingMethod row, not here; this is only the shared endpoint URL.
chilexpress.quote-url=${CHILEXPRESS_QUOTE_URL:https://testservices.wschilexpress.com/rating/api/v1.0/rate/courier}

# Swagger UI at /swagger-ui.html, spec at /v3/api-docs — grouping and security schemes are in
# OpenApiConfig; both paths are already public in SecurityConfig.PUBLIC_PATHS.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.groups-order=asc

# Store onboarding (/api/platform/**): shared secret for the operator-only tool that creates new
# stores — see PlatformApiKeyAuthFilter. REQUIRED, no default (C4): the previous fallback was
# committed here, which left store creation open to anyone who read the repo. The filter refuses to
# start when it's missing or still the old committed value.
app.platform-api-key=${PLATFORM_API_KEY:}

# One shared SMTP relay for the whole platform (not per-store — same criterion as Stripe/S3).
# No default host: EmailServiceImpl detects a blank host and skips sending (logs only) instead of
# throwing, so checkout/password-reset flows never break because mail isn't configured yet.
# MAIL_SMTP_AUTH defaults to false so JavaMail doesn't demand credentials before even trying to
# connect (jakarta.mail throws "no password specified" otherwise) — set it to true ALONGSIDE
# MAIL_USERNAME/MAIL_PASSWORD once there's a real SMTP relay configured.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:no-reply@uvostore.cl}

# EmailServiceImpl already degrades gracefully when mail isn't configured (logs and skips) — the
# actuator health indicator doesn't go through that guard and would try a real SMTP connection,
# which can make /actuator/health report DOWN for something that isn't actually broken.
management.health.mail.enabled=false

# A3: /actuator/health is public (see SecurityConfig.PUBLIC_PATHS) so liveness/readiness probes can
# reach it. Exposure is pinned to health alone and details are hidden, so opening it doesn't hand an
# anonymous caller the rest of actuator or the state of the database behind it.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# A4: rate limiting on the unauthenticated endpoints (login, registration, password recovery, order
# tracking). Counters are per client IP and per rule; forgot-password uses a window 5x longer since
# every hit sends a real email. Tests override these — see the surefire block in pom.xml.
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.login=${RATE_LIMIT_LOGIN:5}
app.rate-limit.register=${RATE_LIMIT_REGISTER:5}
app.rate-limit.forgot-password=${RATE_LIMIT_FORGOT_PASSWORD:3}
app.rate-limit.track=${RATE_LIMIT_TRACK:20}
app.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}

# A2: CORS is an allowlist derived from the stores themselves (TenantCorsConfigurationSource) — an
# origin is accepted only when its hostname resolves to a real store, by custom domain or by
# subdomain slug. This is the escape hatch for origins that aren't a store hostname, e.g. a
# separately hosted SPA build. Empty by default: in dev, Vite proxies /api/* so requests are
# same-origin and CORS never comes into play.
app.cors.additional-origins=${CORS_ADDITIONAL_ORIGINS:}
