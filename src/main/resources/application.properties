spring.application.name=uvo-store

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/uvostore}
spring.datasource.username=${DB_USERNAME:uvostore}
spring.datasource.password=${DB_PASSWORD:}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Dev-only fallback so the app can boot locally without an env var set — override
# JWT_SECRET with a real secret (32+ bytes) in any non-local environment.
jwt.secret=${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-please-32chars-min}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
app.upload-dir=${APP_UPLOAD_DIR:uploads}

# Falls back to the Setting rows (stripe_secret_key/stripe_webhook_secret) when present,
# same precedence as the Laravel StripeService — these are the env-var fallback only.
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.default-currency=${STRIPE_CURRENCY:clp}

# Base URL of the SPA storefront, used to build default Stripe success/cancel URLs when the
# caller doesn't supply its own.
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
