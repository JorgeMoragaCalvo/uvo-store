# IMP-03. Fragmento de prometheus.yml para recoger las métricas de UvoStore. Es un EJEMPLO: la dirección y la ruta
# del archivo del token las fija la provisión del ambiente (IMP-05).
#
# Cómo está protegido /actuator/prometheus (MetricsAuthFilter):
#   1. Red: solo responde a direcciones de PLATFORM_ALLOWED_NETWORKS (la red privada). Desde fuera da 404, igual
#      que una ruta inexistente. El recolector tiene que llegar por la red privada, NO por el dominio público.
#   2. Token: sin METRICS_TOKEN configurado da 404; con un token distinto, 401.
#
# El token va en un archivo montado desde el gestor de secretos, nunca escrito aquí. Rotarlo: cambiar
# METRICS_TOKEN y el archivo a la vez y reiniciar (docs/configuracion-ambientes.md).

global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: uvostore   # alerts.yml usa este nombre en UvoStoreSinMetricas: no cambiarlo por separado.
    metrics_path: /actuator/prometheus
    scheme: http          # dentro de la red privada; si cruza otra red, https.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/uvostore-metrics-token
    static_configs:
      - targets: ["uvostore-app.internal:8080"]   # la dirección PRIVADA del proceso, una por instancia
        labels:
          environment: production                 # o staging; distingue los ambientes en Alertmanager y Grafana
