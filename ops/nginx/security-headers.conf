# IMP-04. Cabeceras de las respuestas que sirven la SPA (index.html y sus archivos).
#
# Se incluye dentro de CADA location que sirve archivos del SPA, no a nivel de server: en nginx, una location
# que declara su propio add_header (Cache-Control, por ejemplo) deja de heredar TODOS los del nivel superior.
#
# - frame-ancestors / X-Frame-Options: la <meta> de la CSP (frontend/csp.ts) no admite frame-ancestors, así que
#   la protección contra el enmarcado del panel solo puede venir de aquí (docs/decision-sesion-panel.md).
#   Esta cabecera se suma a la <meta>: el navegador aplica las dos, y la cabecera no relaja nada de la meta.
# - /api/** y /uploads/** NO lo incluyen: Spring ya pone sus propias cabeceras (SecurityConfig), y repetirlas
#   dejaría X-Frame-Options duplicada.
# - HSTS: el navegador la ignora sobre http (el E2E), así que puede ir aquí y valer igual para staging y
#   producción. Spring no la manda detrás del proxy (request.isSecure() es false sin forward-headers), por eso
#   la pone nginx. Sin includeSubDomains: el dominio de la plataforma puede tener otros servicios.

add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
