# IMP-04. Referencia de nginx para servir UvoStore en un ambiente (staging o producción).
#
# Es un EJEMPLO con marcadores: el dominio de la plataforma, los certificados y la dirección del backend los fija
# IMP-05. Instalación:
#   /etc/nginx/uvostore/            <- uvostore-locations.conf y security-headers.conf de este directorio
#   /etc/nginx/conf.d/uvostore.conf <- este archivo, con los marcadores reemplazados
#   /srv/uvostore/frontend/current  <- lo crea publicar-frontend.sh (symlink a la versión publicada)
# Comprobar: nginx -t. El job "nginx" de .github/workflows/ci.yml lo comprueba con certificados de prueba.
#
# Marcadores:
#   tiendas.example.cl      PUBLIC_PLATFORM_DOMAIN: las tiendas sin dominio propio son <slug>.tiendas.example.cl
#   tienda-propia.example   un dominio verificado de una tienda (stores.domain); un server por dominio o un
#                           certificado con varios nombres
#   127.0.0.1:8080          SERVER_PORT del backend, en la red privada
#
# Va con el backend configurado así (docs/configuracion-ambientes.md):
#   PUBLIC_STOREFRONT_URL=https://{host}   PUBLIC_API_URL=https://{host}   (mismo origen: CSP img-src 'self')
#   RATE_LIMIT_TRUSTED_PROXIES=<la IP de este nginx vista desde el backend>
# Y NUNCA server.forward-headers-strategy (CLAUDE.md).

upstream uvostore_backend {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name .tiendas.example.cl tienda-propia.example;

    # Certbot (HTTP-01) para los dominios propios; el comodín de la plataforma necesita DNS-01.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name .tiendas.example.cl;

    ssl_certificate     /etc/letsencrypt/live/tiendas.example.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tiendas.example.cl/privkey.pem;

    root /srv/uvostore/frontend/current;
    include uvostore/uvostore-locations.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tienda-propia.example;

    ssl_certificate     /etc/letsencrypt/live/tienda-propia.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tienda-propia.example/privkey.pem;

    root /srv/uvostore/frontend/current;
    include uvostore/uvostore-locations.conf;
}
