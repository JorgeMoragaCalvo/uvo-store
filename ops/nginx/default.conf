# IMP-05 (C03). Lo que responde nginx a un Host que ningún server tiene configurado.
#
# Sin esto, nginx usa el primer server del puerto: un dominio cualquiera apuntado a la IP del servidor (o la IP
# sola) recibiría la tienda, con un certificado que no es el suyo. Aquí se corta:
#   - en 80, sin respuesta (444), salvo el desafío de Certbot: así se puede emitir el certificado de un dominio
#     propio nuevo antes de darle su server (ops/servidor/dominio-propio.sh). Solo responde los archivos que
#     Certbot deja en /var/www/certbot, nada más;
#   - en 443, rechazando el handshake TLS (ssl_reject_handshake, nginx 1.19.4 o posterior): no hace falta un
#     certificado para esto ni se le muestra uno ajeno.
#
# Es del servidor entero, no de un ambiente: se instala una sola vez como /etc/nginx/conf.d/uvostore-default.conf.
# Si el nginx del servidor ya tiene otro default_server (el sites-enabled/default de Ubuntu lo tiene),
# provisionar.sh se detiene y lo dice: decidir cuál queda es de operaciones, no de un script.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 444;
    }
}

# http2 en el listen como en los demás server del 443: las opciones de protocolo son del puerto, no del server, y
# si no coinciden nginx avisa ("protocol options redefined") y se queda con unas solas.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
}
