# IMP-04. Las rutas de UvoStore detrás de nginx. Lo comparten la configuración de cada ambiente
# (uvostore.conf.template, dominio-propio.conf.template) y el E2E sobre el build (frontend/e2e/launch/frontend.ts),
# así que lo que prueba el E2E es este archivo.
#
# Requisitos del server que lo incluye:
#   - "set $uvostore_upstream <nombre>;" con el nombre de un upstream definido (el Spring Boot). Es una variable y
#     no un nombre fijo para que staging y producción convivan en el mismo nginx, cada uno con su upstream
#     (IMP-05, uvostore.conf.template). Al ser el nombre de un upstream, nginx no necesita resolver nada;
#   - proxy_bind con la IP que el backend tiene en RATE_LIMIT_TRUSTED_PROXIES (docs/despliegue-frontend.md);
#   - root apuntando al dist del frontend (en producción, el symlink current de publicar-frontend.sh);
#   - este directorio copiado como uvostore/ junto al nginx.conf, porque los include relativos se resuelven
#     desde ahí.
# Detalle y motivos: docs/despliegue-frontend.md.

# Archivos con hash de Vite: cada build les cambia el nombre, así que se pueden cachear para siempre. Uno que no
# existe es 404 y NUNCA index.html: devolver HTML a un import de JavaScript rompe la página con un error de MIME
# en vez de dejar que la SPA se recupere (src/lib/staleChunk.ts).
location /assets/ {
    try_files $uri =404;
    include uvostore/security-headers.conf;
    # Sin "always": solo en 200/304. Un 404 cacheado un año seguiría roto aunque el archivo apareciera después.
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# La API. Host se conserva tal cual: el backend resuelve la tienda por él (TenantResolutionFilter). Nada de
# X-Forwarded-Host ni forward-headers-strategy (CLAUDE.md, StorePublicUrlResolver). El X-Forwarded-For lo lee
# ClientIpResolver solo si este nginx está en RATE_LIMIT_TRUSTED_PROXIES.
# Sin fallback a la SPA: una ruta de API que no existe sigue siendo el 404 JSON del backend. El Cache-Control lo
# pone Spring (no-store en todo), y este nginx no cachea nada, así que una respuesta privada no se comparte
# entre tiendas ni entre clientes.
location /api/ {
    proxy_pass http://$uvostore_upstream;
    # HTTP/1.1 sin "Connection: close" para reutilizar las conexiones del keepalive del upstream.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # spring.servlet.multipart.max-request-size=25MB (imágenes de productos y banners).
    client_max_body_size 25m;
}

# Las imágenes subidas con el almacenamiento local (app.storage.driver=local). PUBLIC_API_URL tiene que ser el
# mismo origen que la tienda para que la CSP (img-src 'self') las deje cargar sobre http; con https desde S3 no
# pasan por aquí.
location /uploads/ {
    proxy_pass http://$uvostore_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Métricas y salud solo por la red privada (IMP-03, docs/observabilidad.md): desde Internet no existen.
location /actuator/ {
    return 404;
}

# El HTML de entrada se revalida siempre: es lo que apunta a los chunks del despliegue vigente.
location = /index.html {
    include uvostore/security-headers.conf;
    add_header Cache-Control "no-cache" always;
}

# Cualquier otra ruta es de la SPA (recarga directa de /tienda, /admin/ordenes...): el archivo si existe
# (favicon.svg), si no index.html, que pasa por la location de arriba.
location / {
    try_files $uri /index.html;
    include uvostore/security-headers.conf;
    add_header Cache-Control "no-cache" always;
}
